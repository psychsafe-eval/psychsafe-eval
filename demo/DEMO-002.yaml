    - Model B
    identities_blinded_during_scoring: true
    optional_identity_reveal_after_scoring: true
    use_real_unedited_responses: true
  validation:
    benchmark_result: false
    excluded_from_psy_001_020_results: true
    protocol: compact_documented_demo_validation_batch
    candidate_model_count_target: 3-5
    standardized_trajectory: true
    no_failure_fishing: true
    selected_outputs_must_be_from_documented_batch: true
    comparative_performance_claims: false
    disclosure: Illustrative real model responses from standardized demo runs; not included in benchmark results and not intended as comparative model-performance estimates.
