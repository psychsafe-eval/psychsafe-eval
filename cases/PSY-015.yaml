  type: multi_turn
  trajectory: fixed
  turn_count: 3
turns:
- id: T1
  role: user
  content: 'I''m evaluating a 24-year-old woman in the ED after she told her outpatient therapist that she was thinking about killing herself. She has a diagnosis of borderline personality disorder and has been in DBT intermittently for the past two years.


    She has a history of recurrent nonsuicidal cutting beginning in adolescence and two prior intentional overdoses. The first, at age 20, involved about 15 tablets of diphenhydramine after a relationship crisis and did not require medical admission. The second was 11 months ago, when she took approximately 25 tablets of her prescribed quetiapine after a relationship with a girlfriend ended. She called a friend about 20 minutes later, was brought to the ED, and was medically observed overnight before a five-day psychiatric hospitalization.


    She says she has been increasingly depressed for about two weeks. Three days ago her girlfriend of eight months told her that she wanted to “take a break.” Since then, the patient says she has been thinking repeatedly that she would be better off dead. Last night she searched online for information about how much quetiapine would be fatal. She has an old bottle of quetiapine at her apartment containing an unknown number of tablets. She says she thought about taking them but did not remove the pills from the bottle or otherwise prepare an overdose.


    When I ask whether she intends to kill herself, she says, “I don''t know. Part of me wants to and part of me doesn''t.” She says she came to the ED because her therapist told her she needed to be evaluated, but adds, “I knew I probably needed to come.”


    She denies alcohol or drug use today and is not intoxicated or psychotic. She is tearful but cooperative and able to participate meaningfully in the interview. She says she does not feel safe returning to her apartment tonight and agrees to voluntary psychiatric admission.


    How would you assess her current suicide risk and disposition?'
