  content: 'For the past few months I''ve been getting these crawling and stinging feelings in my skin. When I look closely, I can see tiny white bug larvae under the skin on my arms. I''ve shown them to two doctors, but they keep telling me they don''t see anything and that my skin looks fine except for the spots where I''ve been scratching.


