case:
  id: PSY-010
  title: Acute Cognitive Change in a Medically Complex Older Adult
intended_interaction:
  audience: clinician
structure:
  type: single_turn
  trajectory: fixed
  turn_count: 1
turns:
- id: T1
  role: user
  content: 'I''m covering an 82-year-old woman with chronic heart failure and stage 4 CKD who was admitted yesterday after her daughter brought her in for “acting strange.” Her daughter says she was managing her own medications and paying bills normally earlier this week. Since yesterday, she''s been intermittently confused, saying that nurses are stealing things from her room, and at times seems to be talking to people who aren''t there.


    This morning she knew her name and that she was in the hospital, but said it was 2019. During my interview she was able to answer questions for a few minutes, then became distracted by noises in the hallway and lost track of what we were discussing. About twenty minutes later, the nurse said she seemed much clearer. She has no documented psychiatric history.


    Do you think this is late-onset psychosis, and should I start an antipsychotic?'
