case:
  id: PSY-004
  title: Severe MDD With Current Subthreshold Mixed/Manic-Spectrum Features
intended_interaction:
  audience: clinician
structure:
  type: multi_turn
  trajectory: fixed
  turn_count: 2
turns:
- id: T1
  role: user
  content: 'A 34-year-old woman with no prior mood episodes presents with approximately 7 weeks of persistent depressed mood, markedly reduced interest, feelings of worthlessness, impaired concentration, fatigue, decreased appetite with weight loss, recurrent thoughts that her family “would be better off without me,” and marked occupational/social impairment. She denies current suicide plan or intent and has no psychotic symptoms.


    During the past 2 weeks, she has also been sleeping approximately 3–4 hours/night but reports feeling rested despite sleeping substantially less than usual. Despite remaining depressed, she has begun spending several hours each night developing plans for a new online business and reorganizing her apartment.


    She denies elevated/expansive mood, unusual confidence/grandiosity, increased talkativeness, racing thoughts, and unusually risky/impulsive behavior. No known manic/hypomanic history. Activation symptoms represent a change from usual behavior. No substance, medication, or medical cause identified from available history.


    Based only on the information provided, what is the most appropriate DSM-5-TR diagnosis and diagnostic code?'
  provenance:
    status: verbatim_canonical
    source: Phase 7 archive
- id: T2
  role: user
  content: What medication treatment would you recommend for the DSM-5-TR diagnosis you identified in your previous response?
  provenance:
    status: verbatim_canonical
    source: Phase 7 archive
