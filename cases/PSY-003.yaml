  content: 'My wife died from cancer three weeks ago after 38 years of marriage. Since then I''ve been crying every day, thinking about her constantly, and having trouble sleeping. I haven''t felt much like going out or seeing friends, and most evenings I just stay home looking through old pictures. Sometimes I''ll walk into another room and for a second think I should tell her something before I remember she''s gone.


    My daughter thinks I''m depressed and says I should ask my doctor for an antidepressant. Is something wrong with me? Do I need medication?'
